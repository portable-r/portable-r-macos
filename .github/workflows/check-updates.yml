# Daily cron to detect new R releases on CRAN macOS.
#
# Every successful check:
#   1. Updates versions.json with new versions
#   2. Regenerates README.md from GitHub releases, including the "Last CRAN
#      check / Last release built" line under the download table
#   3. Commits LAST_CHECKED + README.md (+ versions.json when it changed)
#   4. Triggers builds for any newly discovered R versions
#
# The daily commit makes the cron's liveness auditable from the commit
# history and keeps the README's check date current.

name: Check for Updates

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC daily
  workflow_dispatch:

# One run at a time. (A stale run, e.g. a re-run of a day that already
# committed, fails at Commit on the LAST_CHECKED conflict rather than
# dispatching builds twice.)
concurrency:
  group: check-updates
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Snapshot current versions
        run: cp versions.json versions-before.json

      - name: Check for new releases
        id: check
        run: bash check-updates.sh

      # Refresh the README every run so the "Last CRAN check" date under the
      # table stays current. A failure here only leaves the README as it was;
      # LAST_CHECKED is still committed below.
      - name: Regenerate README
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: bash generate-readme.sh

      # Always commit LAST_CHECKED and README.md; include versions.json when
      # it changed. If a build's README update pushed to main meanwhile,
      # rebase onto it; README.md is fully generated, so a conflict there is
      # resolved by regenerating it. Any other conflict stops the step.
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LAST_CHECKED README.md
          if [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            git add versions.json
          fi
          git diff --staged --quiet && exit 0
          git commit -m "Check updates: $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git push && exit 0
            echo "Push rejected, rebasing ($i/3)..."
            if ! git pull --rebase origin main; then
              if [ "$(git diff --name-only --diff-filter=U)" != "README.md" ]; then
                git rebase --abort || true
                echo "Rebase failed with conflicts outside README.md" >&2
                exit 1
              fi
              git checkout --ours README.md  # the upstream copy (rebase: ours = main)
              bash generate-readme.sh || true
              git add README.md
              GIT_EDITOR=true git rebase --continue
            fi
            if bash generate-readme.sh && ! git diff --quiet README.md; then
              git add README.md
              git commit --amend --no-edit
            fi
          done
          echo "Failed to push after 3 attempts" >&2
          exit 1

      - name: Trigger builds for new R versions
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Lex-sort (not -V) for comm inputs: comm requires POSIX byte order.
          # Version-sort and lex-sort agree for our current range but diverge
          # at R 4.10.0; the final sort -uV below is safe (used for iteration
          # order, not comm input).
          BEFORE_ARM=$(jq -r '.r.arm64[]' versions-before.json | sort)
          AFTER_ARM=$(jq -r '.r.arm64[]'  versions.json        | sort)
          BEFORE_X86=$(jq -r '.r.x86_64[]' versions-before.json | sort)
          AFTER_X86=$(jq -r '.r.x86_64[]'  versions.json        | sort)

          NEW_ARM=$(comm -23 <(echo "$AFTER_ARM") <(echo "$BEFORE_ARM"))
          NEW_X86=$(comm -23 <(echo "$AFTER_X86") <(echo "$BEFORE_X86"))
          NEW_VERSIONS=$(echo -e "${NEW_ARM}\n${NEW_X86}" | sort -uV | grep -v '^$' || true)

          for v in $NEW_VERSIONS; do
            echo "Triggering build for new R $v..."
            gh workflow run "Build Portable R for macOS" -f r_version="$v"
            sleep 5
          done

          echo "Done"
